name: Model Quality Regression
on:
  pull_request:
    branches: [dev0, develop, main]
    paths:
      - 'app/functions/**'
      - 'app/tests/model-quality/**'
      - '.github/workflows/test-model-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: node --test app/functions/_lib/__tests__/model-quality.test.mjs app/functions/_lib/__tests__/openai-migration.test.mjs app/functions/_lib/__tests__/voice-qa-coaching.test.mjs
