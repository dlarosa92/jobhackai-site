name: Retention safety
on:
  pull_request:
    branches: [dev0, develop, main]
    paths:
      - 'app/scripts/lib/*reconcile-core.mjs'
      - 'workers/retention-cleaner/**'
      - 'app/functions/_lib/dev-cutover.js'
      - 'app/functions/_lib/account-deletion-admission.js'
      - 'app/functions/_lib/voice-history.js'
      - 'app/functions/_lib/voice-entitlements.js'
      - 'app/functions/_lib/billing-ownership.js'
      - 'app/functions/_lib/account-deletion*.js'
      - 'app/functions/api/user/export.js'
      - 'app/functions/api/user/delete.js'
      - 'app/functions/api/voice/session/**'
      - 'app/functions/_lib/__tests__/voice-history.test.mjs'
      - 'app/functions/_lib/__tests__/voice-session-report.test.mjs'
      - 'app/functions/_lib/__tests__/user-export.test.mjs'
      - 'app/functions/_lib/__tests__/account-deletion*.test.mjs'
      - 'app/db/schema.sql'
      - 'app/db/migrations/**'
      - 'app/functions/_lib/__tests__/sqlite-d1-helper.mjs'
      - '.github/workflows/test-retention.yml'
  push:
    branches: [dev0, develop, main]
    paths:
      - 'app/scripts/lib/*reconcile-core.mjs'
      - 'workers/retention-cleaner/**'
      - 'app/functions/_lib/dev-cutover.js'
      - 'app/functions/_lib/account-deletion-admission.js'
      - 'app/functions/_lib/voice-history.js'
      - 'app/functions/_lib/voice-entitlements.js'
      - 'app/functions/_lib/billing-ownership.js'
      - 'app/functions/_lib/account-deletion*.js'
      - 'app/functions/api/user/export.js'
      - 'app/functions/api/user/delete.js'
      - 'app/functions/api/voice/session/**'
      - 'app/functions/_lib/__tests__/voice-history.test.mjs'
      - 'app/functions/_lib/__tests__/voice-session-report.test.mjs'
      - 'app/functions/_lib/__tests__/user-export.test.mjs'
      - 'app/functions/_lib/__tests__/account-deletion*.test.mjs'
      - 'app/functions/_lib/__tests__/sqlite-d1-helper.mjs'
      - 'app/db/schema.sql'
      - 'app/db/migrations/**'
      - '.github/workflows/test-retention.yml'
permissions:
  contents: read
jobs:
  retention-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify cleanup, expired responses, export and account deletion
        run: >-
          node --test workers/retention-cleaner/tests/cleanup.test.mjs
          app/functions/_lib/__tests__/voice-history.test.mjs
          app/functions/_lib/__tests__/voice-session-report.test.mjs
          app/functions/_lib/__tests__/user-export.test.mjs
          app/functions/_lib/__tests__/account-deletion-recovery.test.mjs
          app/functions/_lib/__tests__/account-deletion-process.test.mjs
      - name: Install isolated Worker tooling
        run: npm install --prefix "$RUNNER_TEMP/retention-tools" --no-save --package-lock=false wrangler@4.135.0
      - name: Build every retention environment without deployment
        run: |
          for target in dev qa production; do
            "$RUNNER_TEMP/retention-tools/node_modules/.bin/wrangler" deploy --dry-run --env "$target" --config workers/retention-cleaner/wrangler.toml --outdir "$RUNNER_TEMP/jobhackai-retention-$target"
          done
          cp "$RUNNER_TEMP/jobhackai-retention-qa/index.js" "$RUNNER_TEMP/jobhackai-retention-qa/index.mjs"
      - name: Verify compiled retention with real schemas and intercepted KV
        env:
          JOBHACKAI_RETENTION_BUNDLE: ${{ runner.temp }}/jobhackai-retention-qa/index.mjs
        run: node --test workers/retention-cleaner/tests/cleanup.test.mjs
      - name: Verify scheduled cleanup in workerd with isolated D1 and KV
        env:
          JOBHACKAI_RETENTION_BUNDLE: ${{ runner.temp }}/jobhackai-retention-qa/index.js
          JOBHACKAI_MINIFLARE_MODULE: ${{ runner.temp }}/retention-tools/node_modules/miniflare
        run: node --test workers/retention-cleaner/tests/runtime.test.mjs
