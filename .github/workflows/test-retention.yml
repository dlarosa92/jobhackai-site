name: Retention safety
on:
  pull_request:
    branches: [dev0, develop, main]
    paths:
      - 'workers/retention-cleaner/**'
      - 'app/functions/_lib/dev-cutover.js'
      - 'app/functions/_lib/account-deletion-admission.js'
      - 'app/db/migrations/028_account_deletion_recovery.sql'
      - 'app/functions/_lib/__tests__/sqlite-d1-helper.mjs'
      - '.github/workflows/test-retention.yml'
  push:
    branches: [dev0, develop, main]
    paths:
      - 'workers/retention-cleaner/**'
      - 'app/functions/_lib/dev-cutover.js'
      - 'app/functions/_lib/account-deletion-admission.js'
      - 'app/db/migrations/028_account_deletion_recovery.sql'
      - '.github/workflows/test-retention.yml'
permissions:
  contents: read
jobs:
  retention-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test workers/retention-cleaner/tests/cleanup.test.mjs
      - run: |
          npx --yes wrangler@4.135.0 deploy --dry-run --env qa --config workers/retention-cleaner/wrangler.toml --outdir /tmp/jobhackai-retention-worker
          cp /tmp/jobhackai-retention-worker/index.js /tmp/jobhackai-retention-worker/index.mjs
      - name: Verify compiled retention with real schemas and intercepted KV
        env:
          JOBHACKAI_RETENTION_BUNDLE: /tmp/jobhackai-retention-worker/index.mjs
        run: node --test --test-name-pattern='real repository schemas' workers/retention-cleaner/tests/cleanup.test.mjs
