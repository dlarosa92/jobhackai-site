name: Voice Regression

on:
  pull_request:
    branches: [dev0, develop, main]
    paths:
      - 'js/voice-*.js'
      - 'voice-interview.html'
      - 'app/functions/**'
      - 'app/tests/voice-transcripts/**'
      - 'app/package*.json'
      - '.github/workflows/test-voice.yml'
  push:
    branches: [dev0, develop, main]
    paths:
      - 'js/voice-*.js'
      - 'voice-interview.html'
      - 'app/functions/**'
      - 'app/tests/voice-transcripts/**'
      - 'app/package*.json'
      - '.github/workflows/test-voice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: npm run test:voice
        working-directory: app
      - run: node --test functions/_lib/__tests__/voice-managed-client.test.mjs functions/_lib/__tests__/voice-managed-interview.test.mjs functions/_lib/__tests__/voice-provider-calls.test.mjs functions/_lib/__tests__/voice-connection-check.test.mjs
        working-directory: app
