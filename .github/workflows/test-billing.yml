# Billing/webhook integrity suite (Stripe/D1 hotfix). Kept separate from
# test-ats-scoring.yml so the dev0 branch's heavy edits to that workflow
# merge cleanly.
name: Billing Tests

on:
  push:
    branches: [main, develop, dev0]
    paths:
      - 'account-setting.html'
      - 'pricing.html'
      - 'js/voice-cta.js'
      - 'app/functions/api/**'
      - 'app/functions/pricing.js'
      - 'app/functions/_lib/**'
      - 'app/functions/_middleware.js'
      - 'shared/firebase-deletion-client.js'
      - 'workers/voice-followup-email/**'
      - 'app/db/**'
      - 'app/scripts/**'
      - 'scripts/verify-billing-migrations.sh'
      - '.github/workflows/test-billing.yml'
  pull_request:
    branches: [main, develop, dev0]
    paths:
      - 'account-setting.html'
      - 'pricing.html'
      - 'js/voice-cta.js'
      - 'app/functions/api/**'
      - 'app/functions/pricing.js'
      - 'app/functions/_lib/**'
      - 'app/functions/_middleware.js'
      - 'shared/firebase-deletion-client.js'
      - 'workers/voice-followup-email/**'
      - 'app/db/**'
      - 'app/scripts/**'
      - 'scripts/verify-billing-migrations.sh'
      - '.github/workflows/test-billing.yml'

jobs:
  billing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Environment / mode-gate unit tests
        run: node app/functions/_lib/__tests__/stripe-environment.test.mjs

      - name: Subscription period rule tests
        run: node app/functions/_lib/__tests__/subscription-period.test.mjs

      - name: Identity resolution + ownership guard tests
        run: node app/functions/_lib/__tests__/stripe-identity.test.mjs

      - name: updateUserPlan period/unique tests
        run: node app/functions/_lib/__tests__/update-user-plan-period.test.mjs

      - name: Webhook mode-gate end-to-end tests
        run: node app/functions/_lib/__tests__/stripe-webhook-mode-gate.test.mjs

      - name: Webhook identity/idempotency/atomicity end-to-end tests
        run: node app/functions/_lib/__tests__/stripe-webhook-identity.test.mjs

      - name: Trial-conversion exactly-once matrix
        run: node app/functions/_lib/__tests__/trial-conversion.test.mjs

      - name: Reconciliation core tests
        run: node app/functions/_lib/__tests__/billing-reconcile.test.mjs

      - name: Reconciliation drift aborts the full SQLite transaction
        run: node app/functions/_lib/__tests__/billing-reconcile-drift.test.mjs

      - name: Endpoint ownership guards (PR #851 review round)
        run: node app/functions/_lib/__tests__/billing-endpoint-guards.test.mjs

      - name: Billing portal ownership and environment isolation
        run: node --test app/functions/_lib/__tests__/billing-portal-owner.test.mjs

      - name: Billing status ownership and fresh snapshot
        run: node --test app/functions/_lib/__tests__/billing-status-owner.test.mjs

      # dev0 voice integration: the one-time Interview Pack through the
      # hardened webhook (atomic grant + legacy stripe_event_log reconciliation),
      # weekly/monthly subscriptions, and the classifier's handling of pack rows.
      - name: Interview Pack webhook (atomic grant, replay, legacy log)
        run: node app/functions/_lib/__tests__/stripe-webhook-pack.test.mjs

      - name: Voice subscription plans through the webhook
        run: node app/functions/_lib/__tests__/stripe-webhook-voice-plans.test.mjs

      - name: Reconciliation classifier — voice plans and pack rows
        run: node app/functions/_lib/__tests__/billing-reconcile-voice.test.mjs

      - name: Environment stamp / gate (dev-QA isolation, code half)
        run: node app/functions/_lib/__tests__/stripe-webhook-environment-gate.test.mjs

      - name: Reconciliation CLI guards (credential mode, rollback ordering, account pin)
        run: node app/functions/_lib/__tests__/billing-reconcile-guards.test.mjs

      - name: Checkout fulfilment eligibility (paid state, async payments, basil invoices)
        run: node app/functions/_lib/__tests__/stripe-webhook-fulfilment.test.mjs

      - name: Dev cutover pauses requests and scheduled storage writes
        run: node app/functions/_lib/__tests__/dev-cutover.test.mjs

      - name: Migration 022/023 verification (sqlite3)
        run: bash scripts/verify-billing-migrations.sh

      - name: Account pack display
        run: node app/functions/_lib/__tests__/account-pack-display.test.mjs

      - name: Voice offer eligibility and checkout return routes
        run: node --test app/functions/_lib/__tests__/voice-offer-display.test.mjs app/functions/_lib/__tests__/checkout-return.test.mjs app/functions/_lib/__tests__/pricing-route.test.mjs

      - name: Collected payments and refunds (real SQLite)
        run: node app/functions/_lib/__tests__/collected-revenue.test.mjs

      - name: Consent-owned payment attribution (real SQLite)
        run: node --test app/functions/_lib/__tests__/payment-attribution.test.mjs

      - name: Account deletion billing safety
        run: node --test app/functions/_lib/__tests__/account-deletion-billing.test.mjs

      - name: Durable deletion recovery (real SQLite)
        run: node --test app/functions/_lib/__tests__/account-deletion-recovery.test.mjs app/functions/_lib/__tests__/account-deletion-admission.test.mjs app/functions/_lib/__tests__/account-operation-scope.test.mjs app/functions/_lib/__tests__/account-creation-fence.test.mjs app/functions/_lib/__tests__/account-webhook-scope.test.mjs

      - name: Recoverable deletion request, Firebase reconciliation and pending UI
        run: node --test app/functions/_lib/__tests__/account-deletion-process.test.mjs

      - name: Voice follow-up deletion coordination and ambiguous delivery
        run: node --test app/functions/_lib/__tests__/voice-followup-deletion.test.mjs

  admission-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked application dependencies for Pages bundling
        run: npm ci --prefix app --ignore-scripts
      - name: Build the candidate Pages Worker
        run: |
          npx --yes wrangler@4.135.0 pages functions build app/functions --outdir=/tmp/jobhackai-admission-worker
          cp /tmp/jobhackai-admission-worker/index.js /tmp/jobhackai-admission-worker/index.mjs
      - name: Verify actual middleware routing and JWT admission without live providers
        env:
          JOBHACKAI_FUNCTIONS_BUNDLE: /tmp/jobhackai-admission-worker/index.mjs
        run: node --test app/functions/_lib/__tests__/account-operation-bundle.test.mjs
      - name: Build the follow-up Worker without deploying or sending email
        run: |
          npx --yes wrangler@4.135.0 deploy --dry-run --config workers/voice-followup-email/wrangler.toml --env qa --outdir /tmp/jobhackai-followup-worker
          cp /tmp/jobhackai-followup-worker/index.js /tmp/jobhackai-followup-worker/index.mjs
      - name: Verify compiled follow-up Worker with SQLite and intercepted provider traffic
        env:
          JOBHACKAI_FOLLOWUP_BUNDLE: /tmp/jobhackai-followup-worker/index.mjs
        run: node --test app/functions/_lib/__tests__/voice-followup-bundle.test.mjs
