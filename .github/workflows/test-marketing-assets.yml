name: Marketing assets and offers
on:
  pull_request:
    branches: [dev0, develop, main]
    paths:
      - 'marketing/**'
      - 'js/cookie-consent.js'
      - 'js/blog-cta.js'
      - 'css/main.css'
      - 'app/functions/_lib/__tests__/blog-cta.test.mjs'
      - '.github/workflows/test-marketing-assets.yml'
      - 'package.json'
  push:
    branches: [dev0, develop, main]
    paths:
      - 'marketing/**'
      - 'js/cookie-consent.js'
      - 'js/blog-cta.js'
      - 'css/main.css'
      - '.github/workflows/test-marketing-assets.yml'
      - 'package.json'
permissions:
  contents: read
jobs:
  marketing-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: marketing/package-lock.json
      - run: npm --prefix marketing ci --ignore-scripts
      - run: npm run test:agents
      - run: npm run check:agents
      - run: npm run build:marketing
      - uses: actions/upload-artifact@v4
        with:
          name: marketing-dist
          path: marketing/dist/
          if-no-files-found: error
      - run: node marketing/scripts/sync-shared-assets.mjs --check
      - run: node --test app/functions/_lib/__tests__/blog-cta.test.mjs app/functions/_lib/__tests__/analytics-consent.test.mjs
      - run: node --test marketing/tests/directory-consent.test.mjs marketing/tests/directory-consent-runtime.test.mjs marketing/tests/directory-category-runtime.test.mjs marketing/tests/ev-directory-generation.test.mjs
  features-browser:
    # Test the checked-out candidate with intercepted APIs and analytics.
    # This job never visits a deployment or sends collection to GA/Clarity.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: node --test marketing/tests/features-tour-e2e.cjs
        env:
          FEATURES_VENDOR_MODE: stub
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: features-browser-evidence
          path: output/playwright/features-analytics-e2e-stub.json
          if-no-files-found: warn
