name: ATS Scoring & Grammar Tests

on:
  push:
    branches: [main, dev0, develop]
    paths:
      - 'app/functions/_lib/**'
      - 'app/tests/voice-transcripts/**'
      - '.github/workflows/test-ats-scoring.yml'
      - 'app/functions/api/**'
      - 'functions/api/**'
      - 'test-openai-direct.js'
      - 'app/functions/dictionaries/**'
      # These are browser modules, but their suites live in _lib/__tests__ —
      # without these paths they could break untested.
      - 'js/voice-transcript-order.js'
      - 'js/voice-conduct.js'
      - 'js/voice-lifecycle.js'
      - 'js/voice-usage.js'
      - 'js/voice-interview.js'
      - 'js/role-selector.js'
      - 'js/package.json'
      - 'app/db/migrations/033_voice_early_end_grace.sql'
      - 'app/db/migrations/034_voice_question_retries.sql'
  pull_request:
    branches: [main, dev0, develop]
    paths:
      - 'app/functions/_lib/**'
      - 'app/tests/voice-transcripts/**'
      - '.github/workflows/test-ats-scoring.yml'
      - 'app/functions/api/**'
      - 'functions/api/**'
      - 'test-openai-direct.js'
      - 'app/functions/dictionaries/**'
      # These are browser modules, but their suites live in _lib/__tests__ —
      # without these paths they could break untested.
      - 'js/voice-transcript-order.js'
      - 'js/voice-conduct.js'
      - 'js/voice-lifecycle.js'
      - 'js/voice-usage.js'
      - 'js/voice-interview.js'
      - 'js/role-selector.js'
      - 'js/package.json'
      - 'app/db/migrations/033_voice_early_end_grace.sql'
      - 'app/db/migrations/034_voice_question_retries.sql'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Verify dictionary exists
        working-directory: app/functions
        run: |
          if [ ! -f "dictionaries/english-words.txt" ]; then
            echo "❌ Dictionary file not found. Please vendor it in app/functions/dictionaries/english-words.txt"
            exit 1
          fi
          echo "✅ Dictionary file found"

      - name: Run OpenAI migration regressions
        run: npm run test:openai:migration

      - name: Run grammar engine tests
        working-directory: app/functions/_lib/__tests__
        run: node grammar-engine.test.mjs

      - name: Run ATS scoring tests
        working-directory: app/functions/_lib/__tests__
        run: node ats-scoring-engine.test.mjs

      # Deterministic voice suites — no API key, no cost. These prove the
      # transcript assembler and the prompt's own text, NOT that the live model
      # obeys the prompt; that stays a manual dev-session check.
      - name: Run voice transcript ordering tests
        working-directory: app/functions/_lib/__tests__
        run: node voice-transcript-order.test.mjs

      - name: Run voice interviewer prompt tests
        working-directory: app/functions/_lib/__tests__
        run: node voice-interviewer.test.mjs

      - name: Run voice conduct gate tests
        working-directory: app/functions/_lib/__tests__
        run: node voice-conduct.test.mjs

      - name: Run voice lifecycle tests
        working-directory: app/functions/_lib/__tests__
        run: node voice-lifecycle.test.mjs

      # Drives the real js/voice-interview.js against a stub DOM: the report
      # panel and the realtime event routing are only provable by running it.
      - name: Run voice client tests
        working-directory: app/functions/_lib/__tests__
        run: node voice-client.test.mjs

      - name: Run managed voice browser connection and completion tests
        working-directory: app/functions/_lib/__tests__
        run: node --test voice-managed-client.test.mjs

      - name: Run voice report gating tests
        working-directory: app/functions/_lib/__tests__
        run: node --test voice-session-report.test.mjs

      - name: Run voice early-end grace tests (real SQLite)
        working-directory: app/functions/_lib/__tests__
        run: node --test voice-early-end-grace.test.mjs

      - name: Run voice question retry allowance tests (real SQLite)
        working-directory: app/functions/_lib/__tests__
        run: node --test voice-retry.test.mjs

      - name: Run role-based coaching evidence and report tests
        working-directory: app/functions/_lib/__tests__
        run: node --test voice-coaching.test.mjs

      - name: Run voice usage evidence tests
        working-directory: app/functions/_lib/__tests__
        run: node --test voice-usage.test.mjs

      - name: Run role selector helper tests
        working-directory: app/functions/_lib/__tests__
        run: node role-selector.test.mjs

      - name: Run voice entitlement tests
        working-directory: app/functions/_lib/__tests__
        run: node voice-entitlements.test.mjs

      - name: Run voice reservation and completion race tests
        working-directory: app/functions/_lib/__tests__
        run: node voice-reservation.test.mjs

      - name: Run voice history tests
        working-directory: app/functions/_lib/__tests__
        run: node voice-history.test.mjs



      - name: Run voice scorecard grounding and evaluation tests
        run: node app/tests/voice-transcripts/unit.test.mjs
