name: Navigation Guardrails

on:
  push:
    branches: [main, dev0, develop]
    paths:
      - "dashboard.html"
      - "js/firebase-auth.js"
      - "js/navigation.js"
      - "js/logo-link-env.js"
      - "marketing/js/firebase-auth.js"
      - "marketing/js/navigation.js"
      - "marketing/js/logo-link-env.js"
      - "scripts/check-nav-guardrails.sh"
      - "marketing/tests/auth-plan-runtime.test.mjs"
      - ".github/workflows/nav-guardrails.yml"
      - "app/public/dashboard.html"
  pull_request:
    branches: [main, dev0, develop]
    paths:
      - "dashboard.html"
      - "js/firebase-auth.js"
      - "js/navigation.js"
      - "js/logo-link-env.js"
      - "marketing/js/firebase-auth.js"
      - "marketing/js/navigation.js"
      - "marketing/js/logo-link-env.js"
      - "scripts/check-nav-guardrails.sh"
      - "marketing/tests/auth-plan-runtime.test.mjs"
      - ".github/workflows/nav-guardrails.yml"
      - "app/public/dashboard.html"

jobs:
  nav-guardrails:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate navigation/auth guardrails
        run: bash scripts/check-nav-guardrails.sh

      - name: Preserve current and legacy plans across browser auth state
        run: node --test marketing/tests/auth-plan-runtime.test.mjs
