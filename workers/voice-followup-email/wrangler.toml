name = "jobhackai-voice-followup-email"
main = "src/index.js"
compatibility_date = "2024-12-11"

# Hourly sweep: sends the single 48h follow-up email to free users whose
# free voice session went unconverted, and marks stale sessions abandoned.
[triggers]
crons = ["15 * * * *"]

# Secrets per environment (set with `wrangler secret put NAME --env <env>`):
#   RESEND_API_KEY

[env.dev]
name = "jobhackai-voice-followup-email-dev"
d1_databases = [
  { binding = "JOBHACKAI_DB", database_id = "c5c0eee5-a223-4ea2-974e-f4aee5a28bab" }
]
vars = { FRONTEND_URL = "https://dev.jobhackai.io", VOICE_INTERVIEW_ENABLED = "true" }

[env.qa]
name = "jobhackai-voice-followup-email-qa"
d1_databases = [
  { binding = "JOBHACKAI_DB", database_id = "80d87a73-6615-4823-b7a4-19a8821b4f87" }
]
vars = { FRONTEND_URL = "https://qa.jobhackai.io", VOICE_INTERVIEW_ENABLED = "true" }

[env.production]
name = "jobhackai-voice-followup-email-prod"
d1_databases = [
  { binding = "JOBHACKAI_DB", database_id = "f9b709fd-56c3-4a0b-8141-4542327c9d4d" }
]
# Flip VOICE_INTERVIEW_ENABLED to "true" at launch (runbook step 10)
vars = { FRONTEND_URL = "https://app.jobhackai.io", VOICE_INTERVIEW_ENABLED = "false" }
